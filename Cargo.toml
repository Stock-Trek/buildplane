[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
arrow-array = "60"
arrow-schema = "60"
async-trait = "0.1"
aws-config = "1"
aws-credential-types = "1"
aws_lambda_events = { version = "1", default-features = false, features = ["sqs"] }
aws-sdk-lambda = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = "1"
aws-sdk-s3-transfer-manager = "0.2"
aws-sdk-sqs = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sigv4 = "1"
aws-smithy-runtime-api = { version = "1", features = ["client", "http-1x"] }
axum = "0.8"
base64 = "0.23"
bimap = "0.6"
bs58 = "0.5"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
data-encoding = "2"
ed25519-compact = "2"
futures = "0.3"
futures-timer = "3"
hex = "0.4"
hmac = "0.13"
http = "1"
httpdate = "1"
iris = { version = "1", registry = "shipyard" }
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem"] }
lambda_http = { version = "1", features = ["pass_through"] }
lambda_runtime = "1"
lru = "0.18"
metrics = "0.24"
metrics_cloudwatch_embedded = { version = "0.10", features = ["lambda"] }
octocrab = "0.54"
p256 = "0.13"
p384 = "0.13"
parking_lot = "0.12"
parquet = { version = "60", features = ["async"] }
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
query-params = { version = "2", registry = "shipyard" }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rsa = { version = "0.9", features = ["sha2"] }
rust_decimal = "1"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
sha2 = "0.11"
stock-trek = "0.14"
stock-trek-check = "0.3"
stock-trek-types = "0.4"
strum = { version = "0.28", features = ["derive"] }
subtle = "2"
tempfile = "3"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4", "fast-rng"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
