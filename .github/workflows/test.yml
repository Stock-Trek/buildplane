name: Test

on:
  push:
    branches-ignore:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - uses: hashicorp/setup-terraform@v4

      - name: Format
        run: |
          terraform fmt -check -recursive infra/bootstrap
          terraform fmt -check -recursive infra/live
          terraform fmt -check -recursive infra/modules

      - name: Init
        run: |
          terraform -chdir=infra/bootstrap init -backend=false
          terraform -chdir=infra/live init -backend=false

      - name: Validate
        run: |
          terraform -chdir=infra/bootstrap validate
          terraform -chdir=infra/live validate
          terraform -chdir=infra/modules validate

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0
      - name: TFLint Init
        run: tflint --init --config="$GITHUB_WORKSPACE/infra/.tflint.hcl"
      - name: TFLint
        run: tflint --recursive --config="$GITHUB_WORKSPACE/infra/.tflint.hcl"

      - name: Checkov Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          output_format: sarif

      - name: Run Terraform Tests
        run: terraform test -verbose

      - name: Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: "oidc"
          identity-id: "2aecd8e8-fa70-41c3-bf79-a124b5675a46"
          project-slug: "aws"
          env-slug: "dev"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        env:
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ROLE_TERRAFORM_PLAN: ${{ env.AWS_ROLE_TERRAFORM_PLAN }}
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: "arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.AWS_ROLE_TERRAFORM_PLAN }}"
          role-session-name: "buildplane-${{ github.run_id }}"
          retry-max-attempts: 3
          mask-aws-account-id: true

      - name: Plan bootstrap
        run: |
          terraform -chdir=infra/bootstrap init
          terraform -chdir=infra/bootstrap plan

      - name: Plan live
        run: |
          terraform -chdir=infra/live init
          terraform -chdir=infra/live plan

      - name: Set up shipyard ssh auth
        env:
          SHIPYARD_KNOWN_HOST: ${{ env.SHIPYARD_KNOWN_HOST }}
          SHIPYARD_SSH_PRIVATE_KEY_CLIENT: ${{ env.SHIPYARD_SSH_PRIVATE_KEY_CLIENT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ env.SHIPYARD_SSH_PRIVATE_KEY_CLIENT }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ env.SHIPYARD_KNOWN_HOST }}" >> ~/.ssh/known_hosts
          ssh -T git@ssh.shipyard.rs

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run checks
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test
