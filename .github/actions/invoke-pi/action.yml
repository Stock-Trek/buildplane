name: "Invoke pi"
description: "Invoke pi and return structured response"
inputs:
  context-base64:
    description: "Context to send to pi in base64"
    required: true
  prompt-base64:
    description: "Prompt to send to pi in base64"
    required: true
  provider:
    description: "Provider to use for pi"
    required: false
    default: deepseek
  model:
    description: "Model to use for pi"
    required: false
    default: deepseek-flash
  shipyard-ssh-private-key:
    description: "Optional read-only Shipyard deploy key, loaded into a short-lived ssh-agent"
    required: false
  shipyard-known-host:
    description: "Known_hosts entry for ssh.shipyard.rs, required with shipyard-ssh-private-key"
    required: false
outputs:
  response-base64:
    description: "Response json formatted in schema in base64"
    value: ${{ steps.save-response.outputs.pi-response-base64 }}
runs:
  using: "composite"
  steps:
    - shell: bash
      id: pi-response
      env:
        PROVIDER: ${{ inputs.provider }}
        MODEL: ${{ inputs.model }}
        SHIPYARD_SSH_PRIVATE_KEY: ${{ inputs.shipyard-ssh-private-key }}
        SHIPYARD_KNOWN_HOST: ${{ inputs.shipyard-known-host }}
      run: |
        CONTEXT=$(echo "${{ inputs.context-base64 }}" | base64 -d)
        PROMPT=$(echo "${{ inputs.prompt-base64 }}" | base64 -d)
        echo "${PROMPT}"
        echo "provider: ${PROVIDER}"
        echo "model: ${MODEL}"
        MESSAGE=$(printf '%s\n\n%s\n%s\n%s' "${PROMPT}" "<Start of context>" "${CONTEXT}" "<End of context>")
        RESPONSE_FILE=$(mktemp)
        echo "response-file=${RESPONSE_FILE}" >> "$GITHUB_OUTPUT"

        # Stage only the selected provider's key in a short-lived file. Pi reads
        # it through the credential command configured by set-up-pi-models,
        # which deletes the file as soon as it has read it. Creating only the
        # selected provider's file also means the other provider's key never
        # exists on disk during the agent run.
        case "${PROVIDER}" in
          deepseek) PI_KEY="${DEEPSEEK_API_KEY}" ;;
          eden) PI_KEY="${EDENAI_API_KEY}" ;;
          *)
            echo "Error: unknown provider '${PROVIDER}'" >&2
            exit 1
            ;;
        esac
        if [ -z "${PI_KEY}" ]; then
          echo "Error: API key for provider '${PROVIDER}' is not set" >&2
          exit 1
        fi
        mkdir -p "${HOME}/.pi/agent"
        chmod 700 "${HOME}/.pi/agent"
        umask 077
        printf '%s' "${PI_KEY}" > "${HOME}/.pi/agent/.${PROVIDER}-key"

        # The job holds Infisical secrets. Remove credentials from disk and
        # clear the model/registry keys from the environment used by later
        # steps. This is the last pi invocation, so they are not needed again.
        bash .github/scripts/remove-credentials.sh

        # Optional private crate registry access (for example Shipyard). The
        # read-only deploy key is supplied as an input by the opt-in block in
        # agent.yml. Load it into a short-lived ssh-agent only after the
        # credential cleanup above; it is piped to ssh-add and never written to
        # disk. The agent receives only the agent socket, so a prompt injection
        # can use the key to fetch dependencies but cannot read or copy it.
        SSH_AUTH_SOCK_FOR_PI=""
        if [ -n "${SHIPYARD_SSH_PRIVATE_KEY:-}" ]; then
          if [ -z "${SHIPYARD_KNOWN_HOST:-}" ]; then
            echo "Error: shipyard-known-host is required when shipyard-ssh-private-key is set" >&2
            exit 1
          fi
          SSH_DIR="${HOME}/.ssh"
          mkdir -p "${SSH_DIR}"
          chmod 700 "${SSH_DIR}"
          umask 077
          printf '%s\n' "${SHIPYARD_KNOWN_HOST}" >> "${SSH_DIR}/known_hosts"
          chmod 600 "${SSH_DIR}/known_hosts"
          {
            printf '%s\n' 'Host ssh.shipyard.rs'
            printf '%s\n' '  StrictHostKeyChecking yes'
          } > "${SSH_DIR}/config"
          chmod 600 "${SSH_DIR}/config"
          eval "$(ssh-agent -t 3600 -s)" >/dev/null
          if ! printf '%s\n' "${SHIPYARD_SSH_PRIVATE_KEY}" | ssh-add - >/dev/null 2>&1; then
            echo "Error: failed to load the Shipyard deploy key into ssh-agent" >&2
            kill "${SSH_AGENT_PID}" 2>/dev/null || true
            exit 1
          fi
          SSH_AUTH_SOCK_FOR_PI="${SSH_AUTH_SOCK}"
        fi

        # Clear model and registry credentials from the environment used by
        # later steps. This is the last pi invocation, so they are not needed.
        for name in \
          DEEPSEEK_API_KEY \
          EDENAI_API_KEY \
          SHIPYARD_SSH_PRIVATE_KEY_READONLY \
          SHIPYARD_KNOWN_HOST; do
          if [ -n "${!name:-}" ]; then
            printf '%s=\n' "${name}" >> "${GITHUB_ENV}"
          fi
        done
        PI_ENV=(
          HOME="$HOME"
          PATH="$PATH"
          TERM=dumb
          GIT_TERMINAL_PROMPT=0
        )
        if [ -n "${SSH_AUTH_SOCK_FOR_PI}" ]; then
          PI_ENV+=(SSH_AUTH_SOCK="${SSH_AUTH_SOCK_FOR_PI}")
        fi

        # Replace this shell so the credentials in its environment cannot be
        # read back through /proc by the agent while pi runs.
        set +e
        exec env -i "${PI_ENV[@]}" \
          pi \
          --provider "${PROVIDER}" \
          --model "${MODEL}" \
          --no-approve \
          --tools read,write,edit,bash,grep,find,ls \
          --print "${MESSAGE}" \
          > "${RESPONSE_FILE}"
    - shell: bash
      id: save-response
      env:
        RESPONSE_FILE: ${{ steps.pi-response.outputs.response-file }}
      run: |
        if [ ! -s "${RESPONSE_FILE}" ]; then
          echo "Error: pi did not produce a response" >&2
          exit 1
        fi
        # Do not echo the model response: it is untrusted text and could
        # contain secrets the agent encountered, which would then be readable
        # in the workflow logs.
        PI_RESPONSE_BASE64=$(base64 -w 0 < "${RESPONSE_FILE}")
        rm -f "${RESPONSE_FILE}"
        echo "pi-response-base64=${PI_RESPONSE_BASE64}" >> "$GITHUB_OUTPUT"
